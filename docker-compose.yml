version: '3.8'

services:

  # ----------------------
  # DATABASE (MySQL)
  # ----------------------
  db:
    image: mysql:5.7
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: appdb
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"

  # ----------------------
  # BACKEND (Node.js)
  # ----------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend_app
    restart: always
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_USER: user
      DB_PASSWORD: password
      DB_NAME: appdb
    depends_on:
      - db

  # ----------------------
  # FRONTEND (React + Nginx)
  # ----------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend_app
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
